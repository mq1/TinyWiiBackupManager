name: Release

on:
  push:
    branches:
      - main
      - dev
      - next
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/release.yml"
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  # ==================================================================================
  #  Build & Bundle Jobs
  # ==================================================================================
  build-linux:
    name: Build for Linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            arch: i686
            target: i686-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build docker image
        run: docker build -t cargo package/linux

      - name: Download appimagetool
        run: |
          wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool-${{ matrix.arch }}.AppImage

      - name: Build binary
        run: |
          docker run -v $(pwd):/io -w /io cargo build -Z build-std=std,panic_abort --release --target ${{ matrix.target }} --no-default-features --features static-https
          cp target/${{ matrix.target }}/release/TinyWiiBackupManager .

      - name: Package AppImage
        run: |
          cp -rP package/linux/AppDir TinyWiiBackupManager.AppDir
          install -Dm0755 TinyWiiBackupManager TinyWiiBackupManager.AppDir/usr/bin/TinyWiiBackupManager
          mkdir -p dist
          cd dist
          export VERSION=$(yq '.package.version' Cargo.toml)
          ../appimagetool-${{ matrix.arch }}.AppImage \
            --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 19 \
            -u "gh-releases-zsync|mq1|TinyWiiBackupManager|latest|*${{ matrix.arch }}.AppImage.zsync" \
            ../TinyWiiBackupManager.AppDir \
            "TinyWiiBackupManager-${{ env.VERSION_NAME }}-linux-${{ matrix.arch }}.AppImage"
        env:
          ARCH: ${{ matrix.arch }}

      - name: Upload Linux distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: Build for Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-pc-windows-msvc
          - arch: x64
            target: x86_64-win7-windows-msvc
          - arch: x86
            target: i686-win7-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --version=22.1.7 -y

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98
        with:
          components: rust-src

      - name: Download UPX
        if: matrix.arch == 'x64' || matrix.arch == 'x86'
        shell: pwsh
        run: choco install upx

      - name: Build binary
        shell: pwsh
        run: |
          cargo build -Z build-std=std,panic_abort --release --target ${{ matrix.target }}
          Copy-Item -Path "target\${{ matrix.target }}\release\TinyWiiBackupManager.exe" -Destination .
        env:
          RUSTC_BOOTSTRAP: 1
          CC: clang-cl
          AR: llvm-lib
          CFLAGS: /clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link
          CARGO_TARGET_X86_64_WIN7_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C linker-plugin-lto -C link-arg=/FORCE:MULTIPLE -l dylib=ole32
          CARGO_TARGET_I686_WIN7_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C linker-plugin-lto -C link-arg=/FORCE:MULTIPLE -l dylib=ole32
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C linker-plugin-lto
          CARGO_TARGET_X86_64_WIN7_WINDOWS_MSVC_LINKER: lld-link
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: lld-link
          CARGO_TARGET_I686_WIN7_WINDOWS_MSVC_LINKER: lld-link

      - name: Compress binary (UPX)
        if: matrix.arch == 'x64' || matrix.arch == 'x86'
        shell: pwsh
        run: upx --best --lzma "TinyWiiBackupManager.exe"

      - name: Rename binary
        shell: pwsh
        run: |
          New-Item -Path "dist" -ItemType Directory -Force
          Copy-Item "TinyWiiBackupManager.exe" "dist\TinyWiiBackupManager-${{ env.VERSION_NAME }}-windows-${{ matrix.arch }}.exe"

      - name: Upload Windows distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*

  build-macos:
    name: Build for macOS
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install LLVM and LLD
        run: brew install llvm@22 lld@22

      - if: matrix.arch == 'x86_64'
        name: Install x86_64 Homebrew + OpenSSL (for cross-compiling to x86_64-apple-darwin)
        run: |
          # Bootstrap a separate x86_64 Homebrew under Rosetta (installs to /usr/local)
          arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          arch -x86_64 /usr/local/bin/brew install openssl@3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98
        with:
          components: rust-src

      - name: Build binary
        run: |
          cargo build -Z build-std=std,panic_abort --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/TinyWiiBackupManager .
        env:
          RUSTC_BOOTSTRAP: 1
          CC: /opt/homebrew/opt/llvm@22/bin/clang
          AR: /opt/homebrew/opt/llvm@22/bin/llvm-ar
          CFLAGS: -O3 -flto
          RUSTFLAGS: -C linker-plugin-lto -C link-arg=-fuse-ld=/opt/homebrew/opt/lld@22/bin/ld64.lld
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: ./macos-linker.sh
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: ./macos-linker.sh
          X86_64_APPLE_DARWIN_OPENSSL_DIR: /usr/local/opt/openssl@3
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH_x86_64-apple-darwin: /usr/local/opt/openssl@3/lib/pkgconfig

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-${{ matrix.arch }}
          path: TinyWiiBackupManager

  build-macos-universal:
    name: Build for macOS (Universal)
    runs-on: macos-26
    needs: [build-macos]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "build-macos-*"

      - name: Create the .app bundle
        run: |
          cp -r package/macos/App TinyWiiBackupManager.app
          mkdir -p TinyWiiBackupManager.app/Contents/MacOS
          VERSION=$(yq '.package.version' Cargo.toml)
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" TinyWiiBackupManager.app/Contents/Info.plist

      - name: Build the fat binary
        run: |
          lipo -create \
            -output TinyWiiBackupManager.app/Contents/MacOS/TinyWiiBackupManager \
            build-macos-arm64/TinyWiiBackupManager \
            build-macos-x86_64/TinyWiiBackupManager
          chmod 755 TinyWiiBackupManager.app/Contents/MacOS/TinyWiiBackupManager

      - name: Sign the .app bundle
        run: codesign --force --deep -s - TinyWiiBackupManager.app

      - name: Install appdmg
        run: npm i -g appdmg

      - name: Create Universal DMG
        run: |
          mkdir dist
          appdmg package/macos/appdmg.json "dist/TinyWiiBackupManager-${{ env.VERSION_NAME }}-macos-universal.dmg"

      - name: Upload macOS distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos-universal
          path: dist/*

  # ==================================================================================
  #  Release Job: Collects all artifacts and creates a single GitHub Release.
  # ==================================================================================
  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-slim
    needs: [build-linux, build-windows, build-macos, build-macos-universal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download distributables
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "dist-*" # This pattern will match all final distributable artifacts
          merge-multiple: true # This places all matching artifacts into a single 'dist' directory

      - name: Create version.txt
        run: echo -n $(yq '.package.version' Cargo.toml) > dist/version.txt # Write without line break

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: package/release-body.md
          prerelease: ${{ contains(env.VERSION_NAME, 'alpha') || contains(env.VERSION_NAME, 'beta') || contains(env.VERSION_NAME, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
