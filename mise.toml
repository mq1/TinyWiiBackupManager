[tools.rust]
version = "1.99"
profile = "minimal"
components = ["rust-src"]

# llvm needs to match the rust toolchain for linker-plugin-lto (1.99 <-> 23)

# static-clang-images run on manylinux2014
[tools."github:mayeut/static-clang-images"]
version = "23"
os = ["linux"]

[tools."github:llvm/llvm-project"]
version = "prefix:llvmorg-23"
matching = ".zst"
os = ["windows", "macos"]

[env]
RUSTC_BOOTSTRAP = "1" # needed for build-std

[task_templates.build-linux]
run = '''
cargo build -Z build-std=std,panic_abort --release --target {{ vars.target }} --no-default-features --features dist-appimage
mkdir out
cp target/{{ vars.target }}/release/TinyWiiBackupManager out/TinyWiiBackupManager-linux-{{ vars.arch }}
'''

[task_templates.build-linux.env]
CC = "clang"
CXX = "clang++"
AR = "llvm-ar"
RANLIB = "llvm-ranlib"
CFLAGS = "-O3 -flto"
CXXFLAGS = "-O3 -flto"
RUSTFLAGS = "-C linker-plugin-lto -C linker=clang -C link-arg=-fuse-ld=lld"

[tasks.build-linux-x86_64]
extends = "build-linux"
vars = { target = "x86_64-unknown-linux-gnu", arch = "x86_64" }

[tasks.build-linux-aarch64]
extends = "build-linux"
vars = { target = "aarch64-unknown-linux-gnu", arch = "aarch64" }

[tasks.build-linux-i686]
extends = "build-linux"
vars = { target = "i686-unknown-linux-gnu", arch = "i686" }

[task_templates.package-linux]
run = '''
cp -rP package/linux/AppDir TinyWiiBackupManager.AppDir
install -Dm0755 out/TinyWiiBackupManager-linux-{{ vars.arch }} TinyWiiBackupManager.AppDir/usr/bin/TinyWiiBackupManager

export VERSION="$(./scripts/current-version.sh)"
export ARCH="{{ vars.arch }}"

mkdir dist
appimagetool.AppImage \
    --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 19 \
    -u "gh-releases-zsync|mq1|TinyWiiBackupManager|latest|*{{ vars.arch }}.AppImage.zsync" \
    TinyWiiBackupManager.AppDir \
    "dist/TinyWiiBackupManager-{{ env.VERSION_NAME }}-linux-{{ vars.arch }}.AppImage"
'''

[tasks.package-linux-x86_64]
extends = "package-linux"
vars = { arch = "x86_64" }

[tasks.package-linux-x86_64.tools]
"github:AppImage/appimagetool" = "latest"

[tasks.package-linux-aarch64]
extends = "package-linux"
vars = { arch = "aarch64" }

[tasks.package-linux-aarch64.tools]
"github:AppImage/appimagetool" = "latest"

[tasks.package-linux-i686]
"extends" = "package-linux"
"vars" = { arch = "i686" }

[tasks.package-linux-i686.tools]
"github:AppImage/appimagetool" = { version = "latest", asset_pattern = "appimagetool-i686.AppImage" }

[task_templates.build-windows]
shell = "pwsh -Command"
run = '''
cargo build -Z build-std=std,panic_abort --release --target {{ vars.target }} --no-default-features --features {{ vars.features }}
New-Item -ItemType Directory -Path out
Copy-Item -Path target\{{ vars.target }}\release\TinyWiiBackupManager.exe -Destination out\TinyWiiBackupManager-windows-{{ vars.arch }}.exe
'''

[task_templates.build-windows.env]
CC = "clang-cl"
CXX = "clang-cl"
CFLAGS = "/clang:-O3"
CXXFLAGS = "/clang:-O3"
RUSTFLAGS = "-C target-feature=+crt-static"

[tasks.build-windows-x64]
extends = "build-windows"
vars = { target = "x86_64-win7-windows-msvc", arch = "x64", features = "dist-windows-modern" }

[tasks.build-windows-x64.env]
AR = "llvm-lib"
CFLAGS = "/clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link"
CXXFLAGS = "/clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link"
RUSTFLAGS = "-C target-feature=+crt-static -C linker-plugin-lto -C linker=lld-link -C link-arg=/FORCE:MULTIPLE -l dylib=ole32 -L {{ tools['github:Chuyu-Team/VC-LTL5'].path }}\\TargetPlatform\\6.0.6000.0\\lib\\x64 -C link-arg={{ tools['github:Chuyu-Team/YY-Thunks'].path }}\\objs\\x64\\YY_Thunks_for_Vista.obj -C link-arg=/SUBSYSTEM:WINDOWS,6.00 -C link-arg=/VERBOSE:LIB"

[tasks.build-windows-x64.tools]
"github:Chuyu-Team/VC-LTL5" = { version = "latest", asset_pattern = "VC-LTL-Binary.7z" }
"github:Chuyu-Team/YY-Thunks" = { version = "latest", asset_pattern = "YY-Thunks-Objs.zip" }

[tasks.build-windows-arm64]
extends = "build-windows"
vars = { target = "aarch64-pc-windows-msvc", arch = "arm64", features = "dist-windows-modern" }

[tasks.build-windows-arm64.env]
AR = "llvm-lib"
CFLAGS = "/clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link"
CXXFLAGS = "/clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link"
RUSTFLAGS = "-C target-feature=+crt-static -C linker-plugin-lto -C linker=lld-link -L {{ tools['github:Chuyu-Team/VC-LTL5'].path }}\\TargetPlatform\\10.0.10240.0\\lib\\ARM64 -C link-arg=/VERBOSE:LIB"

[tasks.build-windows-arm64.tools]
"github:Chuyu-Team/VC-LTL5" = { version = "latest", asset_pattern = "VC-LTL-Binary.7z" }

[tasks.build-windows-x86]
extends = "build-windows"
vars = { target = "i686-win7-windows-msvc", arch = "x86", features = "dist-windows-legacy" }

[tasks.build-windows-x86.env]
RUSTFLAGS = "-C target-feature=+crt-static -l dylib=ole32 -L {{ tools['github:Chuyu-Team/VC-LTL5'].path }}\\TargetPlatform\\5.1.2600.0\\lib\\Win32 -C link-arg={{ tools['github:Chuyu-Team/YY-Thunks'].path }}\\objs\\x86\\YY_Thunks_for_WinXP.obj -C link-arg=/SUBSYSTEM:WINDOWS,5.01 -C link-arg=/VERBOSE:LIB"

[tasks.build-windows-x86.tools]
"github:Chuyu-Team/VC-LTL5" = { version = "latest", asset_pattern = "VC-LTL-Binary.7z" }
"github:Chuyu-Team/YY-Thunks" = { version = "latest", asset_pattern = "YY-Thunks-Objs.zip" }
"conda:nasm" = "latest"                                                                      # needed for aws-lc

# just a copy
[task_templates.package-windows]
shell = "pwsh -Command"
run = '''
New-Item -ItemType Directory -Path dist
Copy-Item -Path "out\TinyWiiBackupManager-windows-{{ vars.arch }}.exe" -Destination "dist\TinyWiiBackupManager-{{ env.VERSION_NAME }}-windows-{{ vars.arch }}.exe"
'''

[tasks.package-windows-x64]
extends = "package-windows"
vars = { arch = "x64" }

[tasks.package-windows-arm64]
extends = "package-windows"
vars = { arch = "arm64" }

[tasks.package-windows-x86]
extends = "package-windows"
vars = { arch = "x86" }

[task_templates.build-macos]
run = '''
cargo build -Z build-std=std,panic_abort --release --target {{ vars.target }} --no-default-features --features dist-macos
mkdir out
cp target/{{ vars.target }}/release/TinyWiiBackupManager out/TinyWiiBackupManager-macos-{{ vars.arch }}
'''

[task_templates.build-macos.env]
CC = "clang"
CXX = "clang++"
AR = "llvm-ar"
CFLAGS = "-O3 -flto"
CXXFLAGS = "-O3 -flto"
RUSTFLAGS = "-C linker-plugin-lto -C linker={{ config_root }}/macos-linker.sh -C link-arg=-fuse-ld=lld"
SDKROOT = "{{ exec(command='xcrun --sdk macosx --show-sdk-path') }}"

[tasks.build-macos-x86_64]
extends = "build-macos"
vars = { target = "x86_64-apple-darwin", arch = "x86_64" }
env = { MACOSX_DEPLOYMENT_TARGET = "10.12" }

[tasks.build-macos-arm64]
extends = "build-macos"
vars = { target = "aarch64-apple-darwin", arch = "arm64" }
env = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tasks.package-macos-universal]
run = '''
# Create the .app bundle
cp -r package/macos/App TinyWiiBackupManager.app
mkdir -p TinyWiiBackupManager.app/Contents/MacOS
VERSION="$(./scripts/current-version.sh)"
/usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" TinyWiiBackupManager.app/Contents/Info.plist

# Build the fat binary
lipo -create out/TinyWiiBackupManager-macos-x86_64 out/TinyWiiBackupManager-macos-arm64 -output TinyWiiBackupManager.app/Contents/MacOS/TinyWiiBackupManager

# Sign the .app bundle
codesign --force --deep -s - TinyWiiBackupManager.app

# Create the DMG
mkdir dist
appdmg package/macos/appdmg.json "dist/TinyWiiBackupManager-{{ env.VERSION_NAME }}-macos-universal.dmg"
'''

[tasks.package-macos-universal.tools]
node = "lts"
"npm:appdmg" = { version = "latest", depends = ["node"], allow_builds = true }
