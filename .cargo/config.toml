[env]
AWS_LC_SYS_NO_JITTER_ENTROPY = "1"
AWS_LC_SYS_CFLAGS = "-fno-lto"

# ---

[alias]
build-dist-appimage = "--config .cargo/dist.toml build -Z build-std=std,panic_abort --release --no-default-features --features dist-appimage"
build-dist-windows-x64 = "--config .cargo/dist.toml build -Z build-std=std,panic_abort --release --no-default-features --features dist-windows-x64"
build-dist-windows-arm64 = "--config .cargo/dist.toml build -Z build-std=std,panic_abort --release --no-default-features --features dist-windows-arm64"
build-dist-windows-x86 = "--config .cargo/dist.toml build -Z build-std=std,panic_abort --release --no-default-features --features dist-windows-x86"
build-dist-macos = "--config .cargo/dist.toml build -Z build-std=std,panic_abort --release --no-default-features --features dist-macos"
