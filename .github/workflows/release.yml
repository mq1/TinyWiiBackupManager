name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/release.yml"
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package/**"
      - "mise.toml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  # ==================================================================================
  #  Build & Bundle Jobs
  # ==================================================================================
  build-linux:
    name: Build for Linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
          - runner: ubuntu-22.04
            arch: i686

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Build docker image
        run: docker build -f package/linux/Dockerfile.${{ matrix.arch }} -t builder .

      - name: Build and package binary
        run: |
          docker run -v ${{ github.workspace }}:/work -w /work -e VERSION_NAME builder /bin/bash -c "\
            mise trust && \
            mise install && \
            mise run build-linux-${{ matrix.arch }} && \
            mise run package-linux-${{ matrix.arch }}
          "

      - name: Upload Linux distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: Build for Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x64
          - arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install mise and dependencies
        uses: jdx/mise-action@v4

      - name: Build binary
        run: mise run build-windows-${{ matrix.arch }}

      - name: Package
        run: mise run package-windows-${{ matrix.arch }}

      - name: Upload Windows distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*

  build-macos:
    name: Build for macOS
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install mise and dependencies
        uses: jdx/mise-action@v4

      - name: Build binary
        run: mise run build-macos-${{ matrix.arch }}

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-${{ matrix.arch }}
          path: out/*

  build-macos-universal:
    name: Build for macOS (Universal)
    runs-on: macos-latest
    needs: [build-macos]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          path: out
          pattern: "build-macos-*"
          merge-multiple: true

      - name: Install mise and dependencies
        uses: jdx/mise-action@v4

      - name: Package
        run: mise run package-macos-universal

      - name: Upload macOS distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos-universal
          path: dist/*

  # ==================================================================================
  #  Release Job: Collects all artifacts and creates a single GitHub Release.
  # ==================================================================================
  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-slim
    needs: [build-linux, build-windows, build-macos, build-macos-universal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download distributables
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "dist-*" # This pattern will match all final distributable artifacts
          merge-multiple: true # This places all matching artifacts into a single 'dist' directory

      - name: Create version.txt
        run: ./scripts/current-version.sh > dist/version.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: package/release-body.md
          prerelease: ${{ contains(env.VERSION_NAME, 'alpha') || contains(env.VERSION_NAME, 'beta') || contains(env.VERSION_NAME, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
