[package]
name = "TinyWiiBackupManager"
version = "6.1.3"
edition = "2024"
rust-version = "1.98"
authors = ["Manuel Quarneti <mq1@ik.me>"]
license = "GPL-3.0-only"
repository = "https://github.com/mq1/TinyWiiBackupManager"
description = "A tiny game backup and homebrew app manager for the Wii"

[features]
default = ["dist-appimage"] # all statically linked
native-https = ["minreq/https-native-tls"]
static-https = ["minreq/https-openssl-probe", "nod/openssl-vendored"]
static-nod = [
  "nod/compress-lzma-static",
  "nod/compress-zlib-static",
  "nod/compress-zstd-static",
]
static-nod-bzip2 = ["nod/compress-bzip2-static"]

dist-appimage = ["static-https", "static-nod", "static-nod-bzip2"]
dist-flatpak = ["native-https", "nod/default"]
dist-windows-x64 = ["native-https", "static-nod", "static-nod-bzip2"]
dist-windows-arm64 = ["dist-windows-x64"]
dist-windows-x86 = ["native-https", "static-nod"]                     # bzip2 doesn't compile
dist-macos = ["native-https", "static-nod", "static-nod-bzip2"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
  "crisp",
  "linux-theme-detection",
  "tiny-skia",
  "wayland",
  "wgpu-bare",
  "x11",
  "smol",
  "sipper",
  "image-without-codecs",
  "advanced",
] }
iced_palace = "0.14"
iced_aw = { version = "0.14", default-features = false, features = ["spinner"] }
image = { version = "0.25", default-features = false, features = ["png"] }
lucide-icons = { version = "1", features = ["iced"] }
rfd = "0.17"
smol = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
sys-locale = "0.3"
size = "0.5"
fs4 = { version = "1", default-features = false }
which-fs = "0.2"
open = "5"
wii-disc-info = { version = "0.10", features = ["async"] }
twbm-idmap = { version = "0.5", features = ["ascii-titles", "gamehacking"] }
itertools = "0.15"
split-write = "0.2"
tempfile = "3"
arrayvec = { version = "0.7", features = ["serde"] }
zip = { version = "8", default-features = false, features = [
  "deflate-flate2-zlib",
] }
strum = "0.28"
strum_macros = "0.28"
wiiload = { version = "0.5", features = ["async"] }
anyhow = "1"
time = { version = "0.3", features = ["local-offset"] }
minreq = { version = "3", features = ["json-using-serde"] }
nod = { git = "https://github.com/wiidev/nod.git", branch = "fix-block-handling", default-features = false, features = [
  "threading",
] }
semver = "1"
humantime = "2"

[target.'cfg(any(target_os = "linux", target_arch = "aarch64"))'.dependencies]
mundy = { version = "0.2", default-features = false, features = [
  "accent-color",
  "color-scheme",
] }

[target.'cfg(not(any(target_os = "linux", target_arch = "aarch64")))'.dependencies]
dark-light = { version = "3", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = [
  "std",
  "parking_lot",
  "dx12",
] }
winsafe = { version = "0.0.29", features = ["dwm"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = [
  "std",
  "parking_lot",
  "vulkan",
] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = [
  "std",
  "parking_lot",
  "metal",
] }

[build-dependencies]
hex = { version = "0.4", default-features = false }

# tiny and fast
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# speed dev builds
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# faster dev builds
[profile.dev.package."*"]
opt-level = 3
