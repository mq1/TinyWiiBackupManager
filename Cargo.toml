[package]
name = "TinyWiiBackupManager"
version = "7.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["Manuel Quarneti <mq1@ik.me>"]
license = "GPL-3.0-only"
repository = "https://github.com/mq1/TinyWiiBackupManager"
description = "A tiny game backup and homebrew app manager for the Wii"

[features]
default = ["native-tls"]
native-tls = ["ureq/native-tls"]
rustls = ["ureq/rustls", "ureq/platform-verifier"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
  "crisp",
  "linux-theme-detection",
  "tiny-skia",
  "wayland",
  "wgpu-bare",
  "x11",
  "thread-pool",
] }
lucide-icons = { version = "1.21", features = ["iced"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0"
sys-locale = "0.3"
size = "0.5"
fs4 = { version = "1.1", default-features = false }
which-fs = "0.2"
mlua = { version = "0.11", features = ["luajit", "vendored", "anyhow"] }
ureq = { version = "3.3", default-features = false, features = [
  "gzip",
  "json",
] }

# windows x86 has issues with bzip2 + lld
[target.'cfg(all(target_os = "windows", target_arch = "x86"))'.dependencies]
nod = { version = "=2.0.0-alpha.9", default-features = false, features = [
  "compress-lzma-vendored",
  "compress-zlib-vendored",
  "compress-zstd-vendored",
  "threading",
] }

[target.'cfg(not(all(target_os = "windows", target_arch = "x86")))'.dependencies]
nod = "=2.0.0-alpha.9"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = [
  "std",
  "parking_lot",
  "dx12",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = [
  "std",
  "parking_lot",
  "vulkan",
] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = [
  "std",
  "parking_lot",
  "metal",
] }

# Tiny and fast
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# speed up conversions in dev builds
[profile.dev.package."*"]
opt-level = 3
