name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/release.yml"
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}

jobs:
  # ==================================================================================
  #  Build & Bundle Jobs
  # ==================================================================================
  build-linux:
    name: Build for Linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            arch: i686
            target: i686-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 23

      - name: Install i686 dependencies
        if: matrix.arch == 'i686'
        run: sudo apt-get install -y libc6-dev-i386

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: rust-src

      - name: Download appimagetool
        run: |
          wget "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool-${{ matrix.arch }}.AppImage

      - name: Build binary
        run: |
          cargo build -Z build-std=std,panic_abort --release --target ${{ matrix.target }} --no-default-features --features dist-appimage
          cp target/${{ matrix.target }}/release/TinyWiiBackupManager .
        env:
          RUSTC_BOOTSTRAP: 1
          CC: clang-23
          CXX: clang++-23
          AR: llvm-ar-23
          RANLIB: llvm-ranlib-23
          CFLAGS: -O3 -flto
          CXXFLAGS: -O3 -flto
          RUSTFLAGS: -C linker-plugin-lto -C link-arg=-fuse-ld=lld-23
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang-23
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: clang-23
          CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER: clang-23

      - name: Package AppImage
        run: |
          cp -rP package/linux/AppDir TinyWiiBackupManager.AppDir
          install -Dm0755 TinyWiiBackupManager TinyWiiBackupManager.AppDir/usr/bin/TinyWiiBackupManager
          mkdir -p dist
          cd dist
          export VERSION=$(yq '.package.version' Cargo.toml)
          ../appimagetool-${{ matrix.arch }}.AppImage \
            --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 19 \
            -u "gh-releases-zsync|mq1|TinyWiiBackupManager|latest|*${{ matrix.arch }}.AppImage.zsync" \
            ../TinyWiiBackupManager.AppDir \
            "TinyWiiBackupManager-${{ env.VERSION_NAME }}-linux-${{ matrix.arch }}.AppImage"
        env:
          ARCH: ${{ matrix.arch }}

      - name: Upload Linux distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: Build for Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-pc-windows-msvc
          - arch: x64
            target: x86_64-win7-windows-msvc
          - arch: x86
            target: i686-win7-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install LLVM
        shell: bash
        run: |
          curl.exe -sSL "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/clang+llvm-23.1.0-x86_64-pc-windows-msvc.tar.zst" | tar.exe -x --zstd
          mv clang+llvm-23.1.0-x86_64-pc-windows-msvc llvm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: rust-src

      - name: Download and extract VC-LTL5
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Chuyu-Team/VC-LTL5/releases/download/v5.3.1/VC-LTL-Binary.7z" -OutFile "VC-LTL-Binary.7z"
          7z x VC-LTL-Binary.7z -oVC-LTL-Binary

      - name: Dowload and extract YY-Thunks
        if: matrix.arch == 'x64' || matrix.arch == 'x86'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Chuyu-Team/YY-Thunks/releases/download/v1.2.3-Beta.4/YY-Thunks-Objs.zip" -OutFile "YY-Thunks-Objs.zip"
          7z x YY-Thunks-Objs.zip -oYY-Thunks-Objs

      - name: Build binary
        shell: pwsh
        run: |
          cargo build -Z build-std=std,panic_abort --release --target ${{ matrix.target }} --no-default-features --features dist-windows-${{ matrix.arch }}
          Copy-Item -Path "target\${{ matrix.target }}\release\TinyWiiBackupManager.exe" -Destination .
        env:
          RUSTC_BOOTSTRAP: 1
          CC: ${{ github.workspace }}\llvm\bin\clang-cl.exe
          CXX: ${{ github.workspace }}\llvm\bin\clang-cl.exe
          AR: ${{ github.workspace }}\llvm\bin\llvm-lib.exe
          CFLAGS: /clang:-O3 /clang:-flto /clang:-fuse-ld=${{ github.workspace }}\llvm\bin\lld-link.exe
          CXXFLAGS: /clang:-O3 /clang:-flto /clang:-fuse-ld=${{ github.workspace }}\llvm\bin\lld-link.exe
          CARGO_TARGET_X86_64_WIN7_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C linker-plugin-lto -L native=${{ github.workspace }}\VC-LTL-Binary\TargetPlatform\6.0.6000.0\lib\x64 -C link-arg=${{ github.workspace }}\YY-Thunks-Objs\objs\x64\YY_Thunks_for_Vista.obj -l dylib=ole32 -C link-arg=/FORCE:MULTIPLE -C link-arg=/SUBSYSTEM:WINDOWS,6.0
          CARGO_TARGET_I686_WIN7_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C linker-plugin-lto -L native=${{ github.workspace }}\VC-LTL-Binary\TargetPlatform\6.0.6000.0\lib\Win32 -C link-arg=${{ github.workspace }}\YY-Thunks-Objs\objs\x86\YY_Thunks_for_Vista.obj -l dylib=ole32 -C link-arg=/FORCE:MULTIPLE -C link-arg=/SUBSYSTEM:WINDOWS,6.0
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static -C linker-plugin-lto -L native=${{ github.workspace }}\VC-LTL-Binary\TargetPlatform\10.0.10240.0\lib\ARM64
          CARGO_TARGET_X86_64_WIN7_WINDOWS_MSVC_LINKER: ${{ github.workspace }}\llvm\bin\lld-link.exe
          CARGO_TARGET_I686_WIN7_WINDOWS_MSVC_LINKER: ${{ github.workspace }}\llvm\bin\lld-link.exe
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_LINKER: ${{ github.workspace }}\llvm\bin\lld-link.exe

      - name: Rename binary
        shell: pwsh
        run: |
          New-Item -Path "dist" -ItemType Directory -Force
          Copy-Item "TinyWiiBackupManager.exe" "dist\TinyWiiBackupManager-${{ env.VERSION_NAME }}-windows-${{ matrix.arch }}.exe"

      - name: Upload Windows distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*

  build-macos:
    name: Build for macOS
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            deployment_target: 11
          - arch: x86_64
            target: x86_64-apple-darwin
            deployment_target: 10.12

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install LLVM and LLD
        run: brew install llvm@23 lld@23

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: rust-src

      - name: Build binary
        run: |
          cargo build -Z build-std=std,panic_abort --release --target ${{ matrix.target }} --no-default-features --features dist-macos
          cp target/${{ matrix.target }}/release/TinyWiiBackupManager .
        env:
          RUSTC_BOOTSTRAP: 1
          CC: /opt/homebrew/opt/llvm@23/bin/clang
          CXX: /opt/homebrew/opt/llvm@23/bin/clang++
          AR: /opt/homebrew/opt/llvm@23/bin/llvm-ar
          CFLAGS: -O3 -flto -mmacosx-version-min=${{ matrix.deployment_target }}
          CXXFLAGS: -O3 -flto -mmacosx-version-min=${{ matrix.deployment_target }}
          RUSTFLAGS: -C linker-plugin-lto -C link-arg=-fuse-ld=/opt/homebrew/opt/lld@23/bin/ld64.lld
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: ./macos-linker.sh
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: ./macos-linker.sh

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-${{ matrix.arch }}
          path: TinyWiiBackupManager

  build-macos-universal:
    name: Build for macOS (Universal)
    runs-on: macos-latest
    needs: [build-macos]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "build-macos-*"

      - name: Create the .app bundle
        run: |
          cp -r package/macos/App TinyWiiBackupManager.app
          mkdir -p TinyWiiBackupManager.app/Contents/MacOS
          VERSION=$(yq '.package.version' Cargo.toml)
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" TinyWiiBackupManager.app/Contents/Info.plist

      - name: Build the fat binary
        run: |
          lipo -create \
            -output TinyWiiBackupManager.app/Contents/MacOS/TinyWiiBackupManager \
            build-macos-arm64/TinyWiiBackupManager \
            build-macos-x86_64/TinyWiiBackupManager
          chmod 755 TinyWiiBackupManager.app/Contents/MacOS/TinyWiiBackupManager

      - name: Sign the .app bundle
        run: codesign --force --deep -s - TinyWiiBackupManager.app

      - name: Install appdmg
        run: npm i -g appdmg

      - name: Create Universal DMG
        run: |
          mkdir dist
          appdmg package/macos/appdmg.json "dist/TinyWiiBackupManager-${{ env.VERSION_NAME }}-macos-universal.dmg"

      - name: Upload macOS distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos-universal
          path: dist/*

  # ==================================================================================
  #  Release Job: Collects all artifacts and creates a single GitHub Release.
  # ==================================================================================
  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-slim
    needs: [build-linux, build-windows, build-macos, build-macos-universal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download distributables
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "dist-*" # This pattern will match all final distributable artifacts
          merge-multiple: true # This places all matching artifacts into a single 'dist' directory

      - name: Create version.txt
        run: echo -n $(yq '.package.version' Cargo.toml) > dist/version.txt # Write without line break

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: package/release-body.md
          prerelease: ${{ contains(env.VERSION_NAME, 'alpha') || contains(env.VERSION_NAME, 'beta') || contains(env.VERSION_NAME, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
