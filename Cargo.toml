[package]
name = "TinyWiiBackupManager"
version = "7.0.0"
edition = "2024"
rust-version = "1.96"
authors = ["Manuel Quarneti <mq1@ik.me>"]
license = "GPL-3.0-only"
repository = "https://github.com/mq1/TinyWiiBackupManager"
description = "A tiny game backup and homebrew app manager for the Wii"

[features]
default = ["native-tls"]
native-tls = ["bitreq/async-https-native-tls"]
rustls = ["bitreq/async-https-rustls-probe"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
  "crisp",
  "linux-theme-detection",
  "tiny-skia",
  "wayland",
  "wgpu-bare",
  "x11",
  "smol",
  "sipper",
  "image-without-codecs",
  "advanced"
] }
iced_palace = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
lucide-icons = { version = "1.23", features = ["iced"] }
rfd = "0.17"
smol = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0"
sys-locale = "0.3"
size = { version = "0.5", features = ["serde"] }
fs4 = { version = "1.1", default-features = false }
which-fs = "0.2"
mlua = { version = "0.12", features = [
  "lua51",
  "vendored",
  "anyhow",
  "serde",
  "send",
  "async",
] }
bitreq = "0.3"
async-compat = "0.2"
futures = "0.3"
open = "5"

# windows x86 has issues with bzip2 + lld
[target.'cfg(all(target_os = "windows", target_arch = "x86"))'.dependencies]
nod = { version = "=2.0.0-alpha.9", default-features = false, features = [
  "compress-lzma-vendored",
  "compress-zlib-vendored",
  "compress-zstd-vendored",
  "threading",
] }

[target.'cfg(not(all(target_os = "windows", target_arch = "x86")))'.dependencies]
nod = "=2.0.0-alpha.9"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = [
  "std",
  "parking_lot",
  "dx12",
] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = [
  "std",
  "parking_lot",
  "vulkan",
] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27.0", default-features = false, features = [
  "std",
  "parking_lot",
  "metal",
] }

# tiny and fast
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# speed up conversions in dev builds
[profile.dev.package."*"]
opt-level = 3
