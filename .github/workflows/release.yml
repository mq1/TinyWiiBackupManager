name: Release

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/release.yml"
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
  RUSTC_BOOTSTRAP: 1

jobs:
  # ==================================================================================
  #  Build & Bundle Jobs
  # ==================================================================================
  build-linux:
    name: Build for Linux
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:20.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            arch: i686
            target: i686-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl lsb-release software-properties-common gnupg

      - name: Install i686 dependencies
        if: matrix.arch == 'i686'
        run: apt-get install -y libc6-dev-i386

      - name: Install LLVM
        run: |
          curl -LO https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          ./llvm.sh 23

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: rust-src

      - name: Download appimagetool
        run: |
          curl -LO "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.arch }}.AppImage"
          chmod +x appimagetool-${{ matrix.arch }}.AppImage

      - name: Build binary
        run: |
          cargo --config .cargo/dist.toml build -Z build-std=std,panic_abort --release --target ${{ matrix.target }} --no-default-features --features dist-appimage
          cp target/${{ matrix.target }}/release/TinyWiiBackupManager .

      - name: Package AppImage
        run: |
          cp -rP package/linux/AppDir TinyWiiBackupManager.AppDir
          install -Dm0755 TinyWiiBackupManager TinyWiiBackupManager.AppDir/usr/bin/TinyWiiBackupManager
          mkdir -p dist
          cd dist
          export VERSION="$(./scripts/current-version.sh)"
          ../appimagetool-${{ matrix.arch }}.AppImage \
            --comp zstd --mksquashfs-opt -Xcompression-level --mksquashfs-opt 19 \
            -u "gh-releases-zsync|mq1|TinyWiiBackupManager|latest|*${{ matrix.arch }}.AppImage.zsync" \
            ../TinyWiiBackupManager.AppDir \
            "TinyWiiBackupManager-${{ env.VERSION_NAME }}-linux-${{ matrix.arch }}.AppImage"
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Upload Linux distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: Build for Windows
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-pc-windows-msvc
            features: dist-windows-modern
          - arch: x64
            target: x86_64-win7-windows-msvc
            features: dist-windows-modern
          - arch: x86
            target: i686-win7-windows-msvc
            features: dist-windows-legacy

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install LLVM
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-win64.msi" -OutFile llvm.msi
          Start-Process msiexec.exe -Wait -ArgumentList '/i llvm.msi /qn /norestart'
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: rust-src

      - name: Install NASM (for aws-lc-rs)
        if: matrix.features == 'dist-windows-legacy' && matrix.arch != 'x64'
        run: |
          choco install nasm -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download and extract VC-LTL5
        run: |
          Invoke-WebRequest -Uri "https://github.com/Chuyu-Team/VC-LTL5/releases/download/v5.3.1/VC-LTL-Binary.7z" -OutFile "VC-LTL-Binary.7z"
          7z x VC-LTL-Binary.7z -oVC-LTL-Binary

      - name: Dowload and extract YY-Thunks
        if: matrix.arch == 'x64' || matrix.arch == 'x86'
        run: |
          Invoke-WebRequest -Uri "https://github.com/Chuyu-Team/YY-Thunks/releases/download/v1.2.3/YY-Thunks-Objs.zip" -OutFile "YY-Thunks-Objs.zip"
          7z x YY-Thunks-Objs.zip -oYY-Thunks-Objs

      - name: Build binary
        run: |
          cargo --config .cargo/dist.toml build -Z build-std=std,panic_abort --release --target ${{ matrix.target }} --no-default-features --features ${{ matrix.features }}
          Copy-Item -Path "target\${{ matrix.target }}\release\TinyWiiBackupManager.exe" -Destination .

      - name: Rename binary
        run: |
          New-Item -Path "dist" -ItemType Directory -Force
          Copy-Item "TinyWiiBackupManager.exe" "dist\TinyWiiBackupManager-${{ env.VERSION_NAME }}-windows-${{ matrix.arch }}.exe"

      - name: Upload Windows distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-windows-${{ matrix.arch }}
          path: dist/*

  build-macos:
    name: Build for macOS
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install LLVM and LLD
        run: brew install llvm@23 lld@23

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99
        with:
          components: rust-src

      - name: Build binary
        run: |
          cargo --config .cargo/dist.toml build -Z build-std=std,panic_abort --release --target ${{ matrix.target }} --no-default-features --features dist-macos
          cp target/${{ matrix.target }}/release/TinyWiiBackupManager .

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v7
        with:
          name: build-macos-${{ matrix.arch }}
          path: TinyWiiBackupManager

  build-macos-universal:
    name: Build for macOS (Universal)
    runs-on: macos-latest
    needs: [build-macos]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          pattern: "build-macos-*"

      - name: Create the .app bundle
        run: |
          cp -r package/macos/App TinyWiiBackupManager.app
          mkdir -p TinyWiiBackupManager.app/Contents/MacOS
          VERSION="$(./scripts/current-version.sh)"
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" TinyWiiBackupManager.app/Contents/Info.plist

      - name: Build the fat binary
        run: |
          lipo -create \
            -output TinyWiiBackupManager.app/Contents/MacOS/TinyWiiBackupManager \
            build-macos-arm64/TinyWiiBackupManager \
            build-macos-x86_64/TinyWiiBackupManager
          chmod 755 TinyWiiBackupManager.app/Contents/MacOS/TinyWiiBackupManager

      - name: Sign the .app bundle
        run: codesign --force --deep -s - TinyWiiBackupManager.app

      - name: Install appdmg
        run: npm i -g appdmg

      - name: Create Universal DMG
        run: |
          mkdir dist
          appdmg package/macos/appdmg.json "dist/TinyWiiBackupManager-${{ env.VERSION_NAME }}-macos-universal.dmg"

      - name: Upload macOS distributables
        uses: actions/upload-artifact@v7
        with:
          name: dist-macos-universal
          path: dist/*

  # ==================================================================================
  #  Release Job: Collects all artifacts and creates a single GitHub Release.
  # ==================================================================================
  release:
    name: Create GitHub Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-slim
    needs: [build-linux, build-windows, build-macos, build-macos-universal]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download distributables
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "dist-*" # This pattern will match all final distributable artifacts
          merge-multiple: true # This places all matching artifacts into a single 'dist' directory

      - name: Create version.txt
        run: ./scripts/current-version.sh > dist/version.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: package/release-body.md
          prerelease: ${{ contains(env.VERSION_NAME, 'alpha') || contains(env.VERSION_NAME, 'beta') || contains(env.VERSION_NAME, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
