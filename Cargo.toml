[workspace]
resolver = "3"
members = ["crates/gui", "crates/idmap"]
default-members = ["crates/gui"]

[workspace.package]
version = "6.2.0"
edition = "2024"
rust-version = "1.100"
authors = ["Manuel Quarneti <mq1@ik.me>"]
license = "GPL-3.0-only"
repository = "https://github.com/mq1/TinyWiiBackupManager"
description = "A tiny game backup and homebrew app manager for the Wii"

# tiny and fast release builds
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# faster dev builds (runtime)
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# faster dev builds (compilation)
[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
rust_2018_idioms = "deny"
unstable_name_collisions = { level = "allow", priority = 100 }

[workspace.lints.clippy]
all = "deny"
