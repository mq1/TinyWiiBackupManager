name: 🤔 Create Feature Request
description: Suggest a feature to be implemented to UltimateGameBackupManager.
title: '[Feature] '
labels:
  - enhancement

body:
  - type: textarea
    id: text
    attributes:
      label: 📝 Request
    validations:
      required: true

  - type: checkboxes
    id: agreement
    attributes:
      label: 🏴‍☠️ Piracy
      options:
        - label: This feature request is absolutely not related to piracy. I'm aware any mention of piracy would get this feature request deleted.
          required: true
