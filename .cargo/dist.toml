[env]
AWS_LC_SYS_NO_JITTER_ENTROPY = "1" # we don't need this
AWS_LC_SYS_CFLAGS = "-fno-lto"     # otherwise it won't compile

# cc - linux specific
CC_x86_64-unknown-linux-gnu = "clang-23"
CC_aarch64-unknown-linux-gnu = "clang-23"
CC_i686-unknown-linux-gnu = "clang-23"
CXX_x86_64-unknown-linux-gnu = "clang++-23"
CXX_aarch64-unknown-linux-gnu = "clang++-23"
CXX_i686-unknown-linux-gnu = "clang++-23"
AR_x86_64-unknown-linux-gnu = "llvm-ar-23"
AR_aarch64-unknown-linux-gnu = "llvm-ar-23"
AR_i686-unknown-linux-gnu = "llvm-ar-23"
RANLIB_x86_64-unknown-linux-gnu = "llvm-ranlib-23"
RANLIB_aarch64-unknown-linux-gnu = "llvm-ranlib-23"
RANLIB_i686-unknown-linux-gnu = "llvm-ranlib-23"
CFLAGS_x86_64-unknown-linux-gnu = "-O3 -flto"
CFLAGS_aarch64-unknown-linux-gnu = "-O3 -flto"
CFLAGS_i686-unknown-linux-gnu = "-O3 -flto"
CXXFLAGS_x86_64-unknown-linux-gnu = "-O3 -flto"
CXXFLAGS_aarch64-unknown-linux-gnu = "-O3 -flto"
CXXFLAGS_i686-unknown-linux-gnu = "-O3 -flto"

# cc - windows specific
CC_x86_64-win7-windows-msvc = "clang-cl"
CC_aarch64-pc-windows-msvc = "clang-cl"
CC_i686-win7-windows-msvc = "clang-cl"
CXX_x86_64-win7-windows-msvc = "clang-cl"
CXX_aarch64-pc-windows-msvc = "clang-cl"
CXX_i686-win7-windows-msvc = "clang-cl"
AR_x86_64-win7-windows-msvc = "llvm-lib"
AR_aarch64-pc-windows-msvc = "llvm-lib"
AR_i686-win7-windows-msvc = "llvm-lib"
CFLAGS_x86_64-win7-windows-msvc = "/clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link"
CFLAGS_aarch64-pc-windows-msvc = "/clang:-O3 /clang:-flto /clang:-fuse-ld=lld-link"
CFLAGS_i686-win7-windows-msvc = "/clang:-O3"

# cc - macos specific
CC_x86_64-apple-darwin = "/opt/homebrew/opt/llvm@23/bin/clang"
CC_aarch64-apple-darwin = "/opt/homebrew/opt/llvm@23/bin/clang"
CXX_x86_64-apple-darwin = "/opt/homebrew/opt/llvm@23/bin/clang++"
CXX_aarch64-apple-darwin = "/opt/homebrew/opt/llvm@23/bin/clang++"
AR_x86_64-apple-darwin = "/opt/homebrew/opt/llvm@23/bin/llvm-ar"
AR_aarch64-apple-darwin = "/opt/homebrew/opt/llvm@23/bin/llvm-ar"
CFLAGS_x86_64-apple-darwin = "-O3 -flto -mmacosx-version-min=10.12"
CFLAGS_aarch64-apple-darwin = "-O3 -flto -mmacosx-version-min=11"
CXXFLAGS_x86_64-apple-darwin = "-O3 -flto -mmacosx-version-min=10.12"
CXXFLAGS_aarch64-apple-darwin = "-O3 -flto -mmacosx-version-min=11"

[target.x86_64-unknown-linux-gnu]
linker = "clang-23"
rustflags = ["-C", "linker-plugin-lto", "-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
linker = "clang-23"
rustflags = ["-C", "linker-plugin-lto", "-C", "link-arg=-fuse-ld=lld"]

[target.i686-unknown-linux-gnu]
linker = "clang-23"
rustflags = ["-C", "linker-plugin-lto", "-C", "link-arg=-fuse-ld=lld"]

# lto + old windows compatibility + static crt
[target.x86_64-win7-windows-msvc]
linker = "lld-link"
rustflags = [
  "-C",
  "target-feature=+crt-static",
  "-C",
  "linker-plugin-lto",
  "-L",
  "native=.\\VC-LTL-Binary\\TargetPlatform\\6.0.6000.0\\lib\\x64",
  "-C",
  "link-arg=.\\YY-Thunks-Objs\\objs\\x64\\YY_Thunks_for_Vista.obj",
  "-l",
  "dylib=ole32",
  "-C",
  "link-arg=/FORCE:MULTIPLE",
  "-C",
  "link-arg=/SUBSYSTEM:WINDOWS,6.0",
]

# lto + static crt
[target.aarch64-pc-windows-msvc]
linker = "lld-link"
rustflags = [
  "-C",
  "target-feature=+crt-static",
  "-C",
  "linker-plugin-lto",
  "-L",
  "native=.\\VC-LTL-Binary\\TargetPlatform\\10.0.10240.0\\lib\\ARM64",
  "-C",
  "link-arg=/FORCE:MULTIPLE",
]

# old windows compatibility + static crt
[target.i686-win7-windows-msvc]
rustflags = [
  "-C",
  "target-feature=+crt-static",
  "-L",
  "native=.\\VC-LTL-Binary\\TargetPlatform\\5.1.2600.0\\lib\\Win32",
  "-C",
  "link-arg=.\\YY-Thunks-Objs\\objs\\x86\\YY_Thunks_for_WinXP.obj",
  "-l",
  "dylib=ole32",
  "-C",
  "link-arg=/SUBSYSTEM:WINDOWS,5.1",
]

[target.x86_64-apple-darwin]
linker = "./macos-linker.sh"
rustflags = [
  "-C",
  "linker-plugin-lto",
  "-C",
  "link-arg=-fuse-ld=/opt/homebrew/opt/lld@23/bin/ld64.lld",
]

[target.aarch64-apple-darwin]
linker = "./macos-linker.sh"
rustflags = [
  "-C",
  "linker-plugin-lto",
  "-C",
  "link-arg=-fuse-ld=/opt/homebrew/opt/lld@23/bin/ld64.lld",
]
